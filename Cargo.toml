[workspace]
resolver = "2"
members = [
    "crates/fuyao-api",
    "crates/fuyao-core",
    "crates/fuyao-provider",
    "crates/fuyao-session",
    "crates/fuyao-tools",
    "crates/fuyao-skills",
    "crates/fuyao-mcp",
    "crates/fuyao-prompt",
    "crates/fuyao-hooks",
    "crates/fuyao-guard",
    "crates/fuyao-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
# fuyao.toml 写回落：保注释 / 保未知字段 / 保手写格式的增量 patch
toml_edit = "0.25"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
async-trait = "0.1"
regex = "1"
fancy-regex = "0.18"
similar = "3"
strsim = "0.11"
glob = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
serde_yaml = "0.9"
chrono = "0.4"
rust_decimal = { version = "1", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-stream = "0.3"
encoding_rs = "0.8"
libc = "0.2"
dotenvy = "0.15"
dirs = "6"
htmd = "0.5"
scraper = "0.27"
url = "2.5"
http = "1"
rmcp = { version = "1", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
# 日志依赖
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"
# 图片入站节流（normalize：解码/缩放/编码）
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
base64 = "0.23"
# 测试依赖
rstest = "0.26"
tempfile = "3"
pretty_assertions = "1"
mockito = "1"
